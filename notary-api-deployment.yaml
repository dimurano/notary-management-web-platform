apiVersion: apps/v1
kind: Deployment
metadata:
  name: notary-api
  namespace: default
  labels:
    app: notary-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notary-api
  template:
    metadata:
      labels:
        app: notary-api
    spec:
      securityContext:
        fsGroup: 2000
      containers:
      # 1. Main Application Container
      - name: hello
        image: gcr.io/notary-management-web-platform/github.com/dimurano/notary-management-web-platform:b6268bdd65a20c68ae1a499a6008738fbed6cd43
        imagePullPolicy: Always
        env:
        - name: ENVIRONMENT
          value: production
        - name: DATABASE_URL
          value: "postgresql://rfranco:OaklandP69@@127.0.0.1:5432/postgres"
        resources:
          limits:
            cpu: "1"
            memory: 1280Mi
          requests:
            cpu: "1"
            memory: 1280Mi
        startupProbe:
          failureThreshold: 24
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /app/data
          name: notary-api-data-volume

      # 2. Nginx Container
      - name: nginx
        image: nginx:alpine
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 1
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: nginx-config-volume

      # 3. Cloud SQL Auth Proxy Sidecar Container
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
        args:
        - "--port=5432"
        - "notary-management-web-platform:us-central1:notary-db-instance"
        securityContext:
          runAsNonRoot: true
        resources:
          limits:
            cpu: "250m"
            memory: 256Mi
          requests:
            cpu: "100m"
            memory: 128Mi

      volumes:
      - name: notary-api-data-volume
        persistentVolumeClaim:
          claimName: notary-api-data-pvc
      - name: nginx-config-volume
        configMap:
          name: nginx-config
