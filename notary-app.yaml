apiVersion: apps/v1
kind: Deployment
metadata:
  name: notary-api
  namespace: default # Standardized to 'default' as the namespace '1079870257086' does not exist in your cluster
  labels:
    app: notary-api
    commit-sha: e2a3d71514ee1a78dba7d44bff7454546d433857
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notary-api
  template:
    metadata:
      labels:
        app: notary-api
        commit-sha: e2a3d71514ee1a78dba7d44bff7454546d433857
    spec:
      # Note: Ensure the GKE ServiceAccount 'notary-api' exists in the 'default' namespace
      serviceAccountName: notary-api
      containers:
      # 1st Container: Your Main Application (hello)
      - name: hello
        image: gcr.io/notary-management-web-platform/notary-api:latest
        env:
        - name: ENVIRONMENT
          value: production
        resources:
          requests:
            cpu: 1000m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 24

      # 2nd Container: The Nginx Reverse Proxy
      - name: nginx
        image: gcr.io/notary-management-web-platform/nginx-sidecar:latest
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notary-api-lb
  namespace: default
spec:
  # This provisions an external Google Cloud Network Load Balancer (L4) and maps a public IP
  type: LoadBalancer
  selector:
    app: notary-api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
