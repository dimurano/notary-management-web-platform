# Cloud Build pipeline: build, push, deploy to Cloud Run
# Add/override substitutions in the Cloud Build trigger as needed.
substitutions:
  _SERVICE: "notary-api"
  _REPOSITORY: "notary-repository"
  _LOCATION: "us-central1"

steps:
  # Build image and tag both $SHORT_SHA and latest
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "-t"
      - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:$SHORT_SHA"
      - "-t"
      - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:latest"
      - "."

  # Push the SHA-tagged image
  - name: "gcr.io/cloud-builders/docker"
    id: "push-sha"
    waitFor: ["build-image"]
    args:
      - "push"
      - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:$SHORT_SHA"

  # Push the latest tag
  - name: "gcr.io/cloud-builders/docker"
    id: "push-latest"
    waitFor: ["push-sha"]
    args:
      - "push"
      - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:latest"

  # Deploy to Cloud Run using the gcloud builder
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-cloud-run"
    waitFor: ["push-latest"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # By default deploy without allowing unauthenticated access.
        # If you need public access, add --allow-unauthenticated
        gcloud run deploy $_SERVICE \
          --image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:$SHORT_SHA \
          --region=$_LOCATION \
          --platform=managed \
          --project=$PROJECT_ID \
          --allow-unauthenticated

# Register produced images with Cloud Build
images:
  - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:$SHORT_SHA"
  - "$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE:latest"

options:
  machineType: "N1_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
  timeout: "3600s"
