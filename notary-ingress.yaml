apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: notary-api-cert
  namespace: default
spec:
  domains:
    - app.notarialsolutions.com # Replace with your actual domain name
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notary-api-ingress
  namespace: default
  annotations:
    # Tells GKE to provision a Google-managed SSL certificate
    networking.gke.io/managed-certificates: "notary-api-cert"
    # Binds the Ingress to the global static IP we reserved
    kubernetes.io/ingress.global-static-ip-name: "notary-api-static-ip"
    # Enforces traffic to use HTTPS
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: app.notarialsolutions.com # Replace with your actual domain name
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: notary-api-lb # Points back to your existing app service
            port:
              number: 80
