apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: external-gateway
  namespace: default
spec:
  gatewayClassName: gke-l7-global-external-managed # GKE's managed external Application Load Balancer
  selector:
    istio: ingressgateway # Match your ingress gateway controller labels
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: gateway-certs # Must match the Secret name created in Step 1
    hosts:
    - app.notarialsolutions.com # Replace with your external domain
