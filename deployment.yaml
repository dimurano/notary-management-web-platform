apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notary-api-data-pvc
  namespace: default
  labels:
    app: notary-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: notary-api
  name: notary-api
  namespace: default
spec:
  replicas: 1 # Set to 1 to avoid SQLite locking issues across multiple pods
  selector:
    matchLabels:
      app: notary-api
  template:
    metadata:
      labels:
        app: notary-api
        commit-sha: e2a3d71514ee1a78dba7d44bff7454546d433857
    spec:
      containers:
      - name: hello
        image: gcr.io/notary-management-web-platform/github.com/dimurano/notary-management-web-platform:b6268bdd65a20c68ae1a499a6008738fbed6cd43
        imagePullPolicy: Always
        env:
        - name: ENVIRONMENT
          value: production
        volumeMounts:
        - name: notary-api-data-volume
          mountPath: /app/data
        resources:
          limits:
            cpu: "1"
            ephemeral-storage: 1Gi
            memory: 1280Mi
          requests:
            cpu: "1"
            ephemeral-storage: 1Gi
            memory: 1280Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        startupProbe:
          failureThreshold: 24
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 256Mi
          requests:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
      serviceAccountName: notary-api
      volumes:
      - name: notary-api-data-volume
        persistentVolumeClaim:
          claimName: notary-api-data-pvc
